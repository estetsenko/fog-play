services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fogplay
      POSTGRES_PASSWORD: fogplay
      POSTGRES_DB: fogplay
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fogplay"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgres://fogplay:fogplay@postgres:5432/fogplay?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-secret-change-me-0123456789
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
