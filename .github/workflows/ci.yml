name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fogplay
          POSTGRES_PASSWORD: fogplay
          POSTGRES_DB: fogplay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fogplay" --health-interval 2s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: go vet ./...
      - run: make test
